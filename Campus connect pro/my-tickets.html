
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1020">
    <title>My Tickets | CampusConnect Pro</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0b1020;
            color: #f8fafc;
            font-family: Arial, sans-serif;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 18px 6%;
            background: #121a2d;
            border-bottom: 1px solid #293650;
        }

        .brand {
            color: #a78bfa;
            font-size: 21px;
            font-weight: 800;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: #c4b5fd;
        }

        .container {
            width: min(1050px, 92%);
            margin: 35px auto;
        }

        .page-heading {
            margin-bottom: 25px;
        }

        .page-heading h1 {
            margin: 0 0 10px;
            font-size: clamp(27px, 5vw, 36px);
        }

        .muted {
            color: #9eabc4;
            line-height: 1.7;
        }

        .ticket-list {
            display: grid;
            gap: 22px;
        }

        .ticket {
            overflow: hidden;
            background: #141d32;
            border: 1px solid #33415d;
            border-radius: 16px;
        }

        .ticket-header {
            padding: 22px;
            background: linear-gradient(120deg, #302751, #17213a);
            border-bottom: 1px dashed #596582;
        }

        .ticket-header h2 {
            margin: 0 0 10px;
            font-size: 21px;
            overflow-wrap: anywhere;
        }

        .ticket-header p {
            margin: 0;
            color: #d5c9ff;
        }

        .ticket-body {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            padding: 22px;
        }

        .detail-label {
            display: block;
            margin-bottom: 7px;
            color: #9eabc4;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        .detail-value {
            font-size: 15px;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .ticket-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            padding: 18px 22px;
            background: #10182a;
            border-top: 1px solid #293650;
        }

        .ticket-id {
            color: #c4b5fd;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .status {
            display: inline-block;
            margin-top: 9px;
            padding: 6px 10px;
            border-radius: 30px;
            background: #233b35;
            color: #86efac;
            font-size: 12px;
        }

        .status.pending {
            background: #45351b;
            color: #fcd34d;
        }

        .status.cancelled {
            background: #48232c;
            color: #fda4af;
        }

        .btn {
            display: inline-block;
            padding: 11px 16px;
            border: 0;
            border-radius: 8px;
            background: #8b5cf6;
            color: white;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        .btn:hover {
            background: #7c3aed;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #66558f;
            color: #ddd6fe;
        }

        .empty-state {
            padding: 40px 20px;
            text-align: center;
            background: #141d32;
            border: 1px solid #293650;
            border-radius: 16px;
        }

        .empty-state .emoji {
            font-size: 45px;
        }

        .empty-state h2 {
            margin-bottom: 10px;
        }

        .empty-state .btn {
            margin-top: 12px;
        }

        .notice {
            margin-bottom: 20px;
            padding: 13px 16px;
            color: #ddd6fe;
            background: #211b3b;
            border: 1px solid #514078;
            border-radius: 10px;
            line-height: 1.6;
        }

        footer {
            padding: 25px;
            text-align: center;
            color: #8794ad;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 16px 4%;
            }

            .nav-links {
                gap: 12px;
            }

            .container {
                margin-top: 25px;
            }

            .ticket-body {
                grid-template-columns: 1fr;
                gap: 17px;
                padding: 18px;
            }

            .ticket-header {
                padding: 18px;
            }

            .ticket-footer {
                padding: 16px;
            }
        }

        @media print {
            body {
                background: white;
                color: #111827;
            }

            .navbar,
            .page-heading,
            .notice,
            .ticket-actions,
            footer,
            .no-print {
                display: none !important;
            }

            .container {
                width: 100%;
                margin: 0;
            }

            .ticket-list {
                gap: 20px;
            }

            .ticket {
                break-inside: avoid;
                background: white;
                color: #111827;
                border: 1px solid #999;
            }

            .ticket-header,
            .ticket-footer {
                background: #f3f4f6;
                color: #111827;
            }

            .ticket-header p,
            .detail-label,
            .ticket-id {
                color: #374151;
            }

            .status {
                border: 1px solid #777;
                background: white;
                color: #111827;
            }
        }
    </style>
</head>

<body>

<header class="navbar">
    <a href="index.html" class="brand">CampusConnect Pro</a>

    <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="my-ticket.html">My Tickets</a>
        <a href="profile.html">My Profile</a>
        <a href="#" data-logout>Logout</a>
    </nav>
</header>

<main class="container">
    <section class="page-heading">
        <h1>🎟️ My Tickets</h1>
        <p class="muted">
            Your registered campus events, all in one place.
        </p>
    </section>

    <div class="notice" id="ticketNotice" role="status">
        Your event tickets will appear here after registration.
    </div>

    <section
        id="ticketList"
        class="ticket-list"
        aria-live="polite"
    >
        <div class="empty-state">
            <p class="muted">Loading your tickets...</p>
        </div>
    </section>
</main>

<footer>
    © 2026 CampusConnect Pro · Your Campus, Your Community
</footer>

<script src="js/main.js"></script>
<script src="js/auth-demo.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const app = window.CampusConnect;
    const container = document.getElementById("ticketList");
    const notice = document.getElementById("ticketNotice");

    if (!app || !app.STORAGE_KEYS) {
        notice.textContent =
            "Application data system could not be loaded. Check js/main.js.";
        container.innerHTML = "";
        return;
    }

    const user = typeof app.getCurrentUser === "function"
        ? app.getCurrentUser()
        : null;

    if (!user) {
        notice.textContent = "Please log in to view your tickets.";

        container.innerHTML = `
            <div class="empty-state">
                <div class="emoji">🔐</div>
                <h2>Login Required</h2>
                <p class="muted">Sign in to see your event registrations.</p>
                <a class="btn" href="login.html">Login</a>
            </div>
        `;

        return;
    }

    const readList = function (key) {
        const result = app.getData(key, []);
        return Array.isArray(result) ? result : [];
    };

    const safe = function (value) {
        return app.escapeHTML(String(value ?? ""));
    };

    const format = function (value) {
        if (!value) return "Not specified";

        if (typeof app.formatDate === "function") {
            return app.formatDate(value);
        }

        const date = new Date(value);

        return Number.isNaN(date.getTime())
            ? "Not specified"
            : date.toLocaleDateString();
    };

    const userEmail = String(user.email || "").trim().toLowerCase();
    const userId = String(user.id || "");

    const registrations = readList(app.STORAGE_KEYS.registrations);
    const events = readList(app.STORAGE_KEYS.events);

    const myRegistrations = registrations.filter(function (registration) {
        const matchesId = userId &&
            String(registration.userId || "") === userId;

        const matchesEmail = userEmail &&
            String(registration.userEmail || "").trim().toLowerCase()
                === userEmail;

        return Boolean(matchesId || matchesEmail);
    });

    if (!myRegistrations.length) {
        notice.textContent = "No tickets found for your account.";

        container.innerHTML = `
            <div class="empty-state">
                <div class="emoji">🎫</div>
                <h2>No Tickets Yet</h2>
                <p class="muted">
                    You haven't registered for any campus events yet.
                    Explore upcoming events and book your first ticket!
                </p>
                <a class="btn" href="events.html">Explore Events</a>
            </div>
        `;

        return;
    }

    notice.textContent =
        "You have " + myRegistrations.length +
        " event registration(s). Keep your ticket ID handy.";

    container.innerHTML = myRegistrations.map(function (registration) {
        const event = events.find(function (item) {
            return String(item.id) === String(registration.eventId);
        });

        const title = registration.eventTitle ||
            (event && event.title) || "Campus Event";

        const date = registration.eventDate ||
            (event && event.date) || "";

        const time = registration.eventTime ||
            (event && event.time) || "";

        const venue = registration.venue ||
            (event && event.venue) || "Not specified";

        const ticketId = registration.ticketId ||
            registration.id || "Not available";

        const rawStatus = String(
            registration.status || "Confirmed"
        );

        const normalizedStatus = rawStatus.toLowerCase();

        const statusClass = normalizedStatus === "cancelled"
            ? "cancelled"
            : normalizedStatus === "pending"
                ? "pending"
                : "";

        return `
            <article class="ticket">
                <div class="ticket-header">
                    <h2>${safe(title)}</h2>
                    <p>CampusConnect Pro · Event Ticket</p>
                    <span class="status ${statusClass}">
                        ${safe(rawStatus)}
                    </span>
                </div>

                <div class="ticket-body">
                    <div>
                        <span class="detail-label">Attendee</span>
                        <div class="detail-value">
                            ${safe(registration.userName || user.name || "Student")}
                        </div>
                    </div>

                    <div>
                        <span class="detail-label">Email</span>
                        <div class="detail-value">
                            ${safe(registration.userEmail || user.email || "Not specified")}
                        </div>
                    </div>

                    <div>
                        <span class="detail-label">Event Date</span>
                        <div class="detail-value">${safe(format(date))}</div>
                    </div>

                    <div>
                        <span class="detail-label">Event Time</span>
                        <div class="detail-value">${safe(time || "Not specified")}</div>
                    </div>

                    <div>
                        <span class="detail-label">Venue</span>
                        <div class="detail-value">${safe(venue)}</div>
                    </div>

                    <div>
                        <span class="detail-label">Ticket ID</span>
                        <div class="detail-value">${safe(ticketId)}</div>
                    </div>
                </div>

                <div class="ticket-footer">
                    <div class="ticket-id">
                        Registration ID: ${safe(registration.id || "N/A")}
                    </div>

                    <div class="ticket-actions">
                        <button
                            type="button"
                            class="btn"
                            data-print-ticket
                        >
                            🖨️ Print Ticket
                        </button>
                    </div>
                </div>
            </article>
        `;
    }).join("");

    container.addEventListener("click", function (event) {
        const button = event.target.closest("[data-print-ticket]");

        if (!button) return;

        const ticket = button.closest(".ticket");

        if (!ticket) return;

        window.print();
    });
});
</script>

</body>
</html>
